[build]
	command = "npm run build"
	publish = ".next"

[build.environment]
	NODE_VERSION = "24"

[[plugins]]
	package = "@netlify/plugin-nextjs"

# The ESOL course, at the short URL people will say out loud.
#
# 302, not 301: the event page 404s once the course ends, and browsers cache a
# 301 for good. When the course is over, point this back at /whats-on — or at
# the next course.

[[redirects]]
	from = "/esol"
	to = "/whats-on/esol"
	status = 302
	force = true

# Pages retired in the redesign.
#
# These URLs are live on the current site and may be linked or indexed, so they
# redirect rather than 404. Both were activity pages, and What's On is where
# activities now live — a related page beats a dead end for anyone arriving
# from an old link or a search result.
#
# 301, because the removal is permanent.

[[redirects]]
	from = "/art-course"
	to = "/whats-on"
	status = 301
	force = true

[[redirects]]
	from = "/art-course-exhibition"
	to = "/whats-on"
	status = 301
	force = true

# Events moved under What's On.
#
# They were briefly served from /events and /events/:uid, and a printed QR code
# points at one of those URLs — paper cannot be redeployed, so this redirect is
# permanent regardless of how short-lived the original route was.
#
# The splat keeps each event's own UID, so the QR code lands on the event rather
# than on the index.

[[redirects]]
	from = "/events"
	to = "/whats-on"
	status = 301
	force = true

[[redirects]]
	from = "/events/*"
	to = "/whats-on/:splat"
	status = 301
	force = true
